name: Download CSV

on:
  schedule:
    # Every hour from 06:00 to 00:00 Paris (summer, UTC+2) = 04:00-22:00 UTC
    - cron: '0 4-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Velib CSV 
        run: |
          mkdir -p data
          STAMP=$(date -u +'%Y-%m-%d_%H%M')
          curl -L -f -o data/velib/velib_$STAMP.csv "https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/velib-disponibilite-en-temps-reel/exports/csv?lang=fr&timezone=Europe%2FBerlin&use_labels=true&delimiter=%3B"

      - name: Save it to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "update CSV $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
